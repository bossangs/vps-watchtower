<h2>编辑套餐元数据：{{plan.name}}</h2><form class="card" method="post"><label>商家</label><select name="provider_id"><option value="">未指定</option>{% for p in providers %}<option value="{{p.id}}" {% if plan.provider_id==p.id %}selected{% endif %}>{{p.name}}</option>{% endfor %}</select><label>地区</label><input name="location" value="{{plan.location or ''}}"><label>CPU</label><input name="cpu" value="{{plan.cpu or ''}}"><div class="grid"><input name="ram_mb" type="number" min="0" value="{{plan.ram_mb if plan.ram_mb is not none else ''}}" placeholder="RAM MB"><input name="disk_gb" type="number" min="0" step="any" value="{{plan.disk_gb if plan.disk_gb is not none else ''}}" placeholder="磁盘 GB"><input name="bandwidth_gb" type="number" min="0" step="any" value="{{plan.bandwidth_gb if plan.bandwidth_gb is not none else ''}}" placeholder="流量 GB"><input name="price" type="number" min="0" step="any" value="{{plan.price if plan.price is not none else ''}}" placeholder="价格"></div><div class="grid"><input name="currency" maxlength="12" value="{{plan.currency or ''}}" placeholder="币种"><input name="billing_period" value="{{plan.billing_period or ''}}" placeholder="月 / 年 / 一次性"><select name="stock_status"><option value="unknown" {% if plan.stock_status=='unknown' %}selected{% endif %}>未知</option><option value="in_stock" {% if plan.stock_status=='in_stock' %}selected{% endif %}>有货</option><option value="out_of_stock" {% if plan.stock_status=='out_of_stock' %}selected{% endif %}>售罄</option></select><input name="soldout_keywords" value="{{plan.soldout_keywords or ''}}" placeholder="售罄关键词（逗号分隔）"></div><label><input type="checkbox" name="public" value="1" {% if plan.public %}checked{% endif %}> 发布到公开目录</label><br><button>保存元数据</button></form>
