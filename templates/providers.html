<h2>商家目录</h2><div class="grid">{% for p in providers %}<article class="card"><h3><a href="{{url_for('provider_public',provider_id=p.id)}}">{{p.name}}</a></h3><p>{{p.description or '暂无介绍'}}</p><p>{{p.plan_count}} 个公开套餐</p>{% if p.website %}<a href="{{p.website}}" rel="nofollow noopener">访问官网</a>{% endif %}{% if p.push_url %}<p><a href="{{p.push_url}}" rel="nofollow noopener noreferrer">商家 / 购买链接</a></p>{% endif %}</article>{% else %}<p>暂无公开商家。</p>{% endfor %}</div>
