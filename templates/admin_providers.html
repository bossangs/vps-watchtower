<h2>商家管理</h2><p class="muted">可设置商家官网、原创中文介绍，并在套餐编辑中关联套餐。官网仅接受无账号密码的 HTTP/HTTPS 地址。商家接收推送的 Webhook 在创建商家后独立配置，仅管理员可见。</p><form class="card" method="post"><h3>新增商家</h3><input name="name" required maxlength="160" placeholder="商家名称"><input name="website" maxlength="500" placeholder="官网 URL（http/https）"><input name="push_url" maxlength="500" placeholder="通知点击跳转的商家/购买链接（可空）"><textarea name="description" maxlength="3000" placeholder="原创介绍"></textarea><button>创建</button></form>{% for p in providers %}<form class="card" method="post" action="{{url_for('admin_provider_edit',provider_id=p.id)}}"><h3>#{{p.id}} 编辑商家</h3><input name="name" required value="{{p.name}}"><input name="website" value="{{p.website}}"><input name="push_url" value="{{p.push_url or ''}}" placeholder="通知跳转链接（不是接收 Webhook）"><textarea name="description">{{p.description}}</textarea><button>保存</button> <a class="btn gray" href="/admin/providers/{{p.id}}/webhook">Webhook 设置与记录</a> <button class="btn red" formaction="{{url_for('admin_provider_delete',provider_id=p.id)}}" formmethod="post">删除</button></form>{% endfor %}
