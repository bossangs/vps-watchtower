services:
  watchtower:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: "true"
    expose: ["8080"]
    volumes:
      - ./data:/data
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [watchtower]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      watchtower:
        condition: service_healthy
    networks: [watchtower]
networks:
  watchtower:
    driver: bridge
volumes:
  caddy_data:
  caddy_config:
